# Mascot-Lab v1 model selection record. PROVISIONAL.
#
# Names the model chosen after the first real evaluation on November 6, 2026,
# by its exact Ollama tag from configs/models.yaml. It does not change the
# shared six-model evaluation configuration: configs/models.yaml still lists
# all six candidates with one baseline, and every evaluation still compares
# them under identical settings. No code reads this file yet; the `chat` and
# `evaluate` commands still take --model explicitly.
#
# The choice is provisional: the grades behind it are an AI reviewer's
# provisional grades, the rubric is still provisional, and the owner has not
# yet reviewed either. Nothing is deployed, and the selected model is not
# ready for public deployment. The evidence, reasons, weaknesses, and launch
# blockers are in docs/model-selection-v1.md.
#
# tests/test_selection.py checks this file against configs/models.yaml.

