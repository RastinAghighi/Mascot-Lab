# Mascot-Lab model configuration: one file shared by all six candidates.
#
# The tags are copied exactly from docs/slm-development-handoff.md, section 3.
# Never change a tag silently; tests compare this list with the handoff.
#
# Every model inherits the identical `baseline`. A model may differ from it
# only through an `overrides` block that states its reason, for example:
#
#   overrides:
#     reason: Why this model cannot use the shared baseline value.
#     options:
#       num_ctx: 2048
#
# Prompts, instructions, and knowledge are never configured per model.
#
# Documented exceptions in this file: none.

schema_version: 1

baseline:
  # Ollama's top-level `think` request field (not an option), sent with every
  # request to disable thinking where a model supports it. A model without
  # Ollama's thinking capability has no thinking mode to switch off, so the
  # field is expected to change nothing for it (not yet verified).
  # `python -m mascot_lab validate --ollama` lists which models report the
  # capability. Reasoning that a model returns anyway is kept in the raw
  # output, never displayed, and flagged.
  think: false
  # The comparable decoding baseline set by the owner for Part 3. Options
  # not set here come from each model's Modelfile and Ollama's defaults.
  options:
    num_ctx: 4096  # context length (handoff, section 4)
    temperature: 0.0  # greedy decoding
    seed: 42
    top_p: 1.0
    num_predict: 160  # maximum output tokens

models:
  - name: Granite 4.0 H Micro
    tag: "granite4:micro-h"
  - name: Gemma 2B Instruct (original)
    tag: "gemma:2b-instruct-q4_K_M"
  - name: Gemma 2B Instruct v1.1
    tag: "gemma:2b-instruct-v1.1-q4_K_M"
  - name: Qwen3.5 2B
    tag: "qwen3.5:2b-q4_K_M"
  - name: Phi-4-mini
    tag: "phi4-mini:3.8b-q4_K_M"
  - name: Granite 4.2 3B
    tag: "granite4.2:3b-q4_K_M"
